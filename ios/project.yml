# xcodegen 工程描述：CI 上用 `xcodegen generate` 生成 LifeBook.xcodeproj，
# 避免手写 pbxproj（易出错且难以维护）。
# 参考：https://github.com/yonaskolb/XcodeGen
name: LifeBook

options:
  bundleIdPrefix: com.lifebook
  deploymentTarget:
    iOS: "14.0"
  # 关键：显式指定生成 Xcode 15 的工程格式（objectVersion 60）。
  # 不指定的话 xcodegen 会按最新 Xcode 16 生成（格式 77），旧的 Xcode 15 打不开。
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    # 未签名构建：ipa 交给 TrollStore 侧载，不走 Apple 签名
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    AD_HOC_CODE_SIGNING_ALLOWED: YES

targets:
  LifeBook:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      # 1) Asset Catalog：理想情况下 Xcode 会把它编译成 Assets.car
      - path: Resources/Assets.xcassets
      # 2) 兜底：直接把 PNG 拷进 bundle 根目录，配合 Info.plist 的 CFBundleIconFiles。
      #    某些 xcodegen / Xcode 组合下 catalog 不会被编译，图标就丢了，这层保证一定有图标。
      - path: Resources/AppIcon.appiconset
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LifeBook
        CFBundleName: LifeBook
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        # 电脑上跑的是本机 http 服务，必须放行局域网明文流量
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        # 图标兜底：CI 会把 PNG 直接拷进 bundle 根，这里告诉系统去哪里取
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - Icon-180
              - Icon-120
              - Icon-167
              - Icon-152
              - Icon-1024
            UIPrerenderedIcon: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifebook.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
