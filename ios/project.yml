# xcodegen 工程描述：CI 上用 `xcodegen generate` 生成 LifeBook.xcodeproj，
# 避免手写 pbxproj（易出错且难以维护）。
# 参考：https://github.com/yonaskolb/XcodeGen
name: LifeBook

options:
  bundleIdPrefix: com.lifebook
  deploymentTarget:
    iOS: "14.0"
  # 关键：显式指定生成 Xcode 15 的工程格式（objectVersion 60）。
  # 不指定的话 xcodegen 会按最新 Xcode 16 生成（格式 77），旧的 Xcode 15 打不开。
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    # 未签名构建：ipa 交给 TrollStore 侧载，不走 Apple 签名
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    AD_HOC_CODE_SIGNING_ALLOWED: YES

targets:
  LifeBook:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      # 1) Asset Catalog：理想情况下 Xcode 会把它编译成 Assets.car
      - path: Resources/Assets.xcassets
      # 2) 兜底：直接把 PNG 拷进 bundle 根目录，配合 Info.plist 的 CFBundleIconFiles。
      #    某些 xcodegen / Xcode 组合下 catalog 不会被编译，图标就丢了，这层保证一定有图标。
      - path: Resources/AppIcon.appiconset
      # 3) 整个前端（本地服务提供的静态资源），必须带目录结构进 bundle。
      #    注意这里放的是 web/ 而不是 web/static：folder 引用会按**自身名字**落进
      #    bundle，指到 web/ 才能得到 web/static/...，页面里的 `/static/xxx` 才命得中。
      #    （指到 web/static 会得到 web/xxx，把 static 这层抹掉，页面资源全 404。）
      - path: ../web
        name: web
        type: folder
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LifeBook
        CFBundleName: LifeBook
        # 1.0.1：修「页面资源全部 404」——打包抹掉了 static/ 那一层，
        # 导致样式表与 js/app.js 都加载不到（界面裸奔、按钮没反应）。
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "3"
        LSRequiresIPhoneOS: true
        # 只放行本机回环地址的明文请求（App 自带的本地服务）。
        # 不用 NSAllowsArbitraryLoads —— 数据不再出设备，没有理由放开任意外网明文。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 记账凭证拍照/选图所需；照片只保存在本机，不会上传
        NSCameraUsageDescription: 用于拍摄记账凭证照片，照片只保存在本机
        NSPhotoLibraryUsageDescription: 用于选择记账凭证照片，照片只保存在本机
        UILaunchScreen:
          UIColorName: LaunchBackground
        # 图标配置由 CI 用 PlistBuddy 写入（单一来源，避免和这里重复）
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifebook.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
