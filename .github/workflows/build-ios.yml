name: Build LifeBook iOS (unsigned ipa)

# 产出未签名 .ipa —— 给 TrollStore（巨魔）侧载用，不需要 Apple 开发者账号。
# 触发方式：推代码 / 在 GitHub 网页上点 Run workflow。
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: |
          brew install xcodegen || brew upgrade xcodegen || true
          xcodegen --version

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate --spec project.yml
          ls -d LifeBook.xcodeproj

      # 用 build 而非 archive：archive 环节会强制走签名校验，未签名构建容易失败。
      # 产物直接落在 CONFIGURATION_BUILD_DIR，后面手工打 Payload 即可。
      - name: Build unsigned app
        run: |
          set -e
          cd ios
          xcodebuild build \
            -project LifeBook.xcodeproj \
            -scheme LifeBook \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          ls -d build/Release-iphoneos/*.app

      - name: Package ipa
        run: |
          set -e
          cd ios/build
          rm -rf Payload LifeBook.ipa
          mkdir -p Payload
          cp -R Release-iphoneos/*.app Payload/
          # ad-hoc 签名：codesign 是 macOS 自带工具，保证 bundle 结构完整可用
          codesign --force --deep --sign - Payload/*.app || true
          zip -qry LifeBook.ipa Payload
          ls -lh LifeBook.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeBook-unsigned-ipa
          path: ios/build/LifeBook.ipa
          if-no-files-found: error
