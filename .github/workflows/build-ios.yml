name: Build LifeBook iOS (unsigned ipa)

# 产出未签名 .ipa —— 给 TrollStore（巨魔）侧载用，不需要 Apple 开发者账号。
# 触发方式：推代码 / 在 GitHub 网页上点 Run workflow。
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      # 前端资源会被打进 ipa（由 App 自带的本地服务提供），所以只改 web/ 也要重新出包，
      # 否则会拿着旧界面测新代码。
      - "web/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick newest Xcode
        continue-on-error: true
        run: |
          ls -d /Applications/Xcode_*.app 2>/dev/null || true
          XC16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | head -1 || true)
          if [ -n "$XC16" ]; then sudo xcode-select -s "$XC16"; fi
          xcodebuild -version

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: |
          brew install xcodegen || brew upgrade xcodegen || true
          xcodegen --version

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate --spec project.yml
          ls -d LifeBook.xcodeproj

      # 用 build 而非 archive：archive 环节会强制走签名校验，未签名构建容易失败。
      # 产物直接落在 CONFIGURATION_BUILD_DIR，后面手工打 Payload 即可。
      - name: Build unsigned app
        run: |
          set -e
          cd ios
          xcodebuild build \
            -project LifeBook.xcodeproj \
            -scheme LifeBook \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          ls -d build/Release-iphoneos/*.app

      - name: Package ipa
        run: |
          set -e
          cd ios/build
          rm -rf Payload LifeBook.ipa
          mkdir -p Payload
          cp -R Release-iphoneos/*.app Payload/
          APP=$(echo Payload/*.app)

          # 图标：不依赖 Asset Catalog（xcodegen 组合下不一定编译成 Assets.car），
          # 直接把 PNG 拷进 bundle 根，再用 PlistBuddy 写 CFBundleIconFiles。
          cp ../Resources/AppIcon.appiconset/*.png "$APP/"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Add :CFBundleIcons dict" "$APP/Info.plist" 2>/dev/null || true
          $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$APP/Info.plist" 2>/dev/null || true
          $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$APP/Info.plist" 2>/dev/null || true
          for f in Icon-180 Icon-120 Icon-167 Icon-152 Icon-1024; do
            $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles: string $f" "$APP/Info.plist" 2>/dev/null || true
          done
          echo "--- 图标配置 ---"
          $PB -c "Print :CFBundleIcons" "$APP/Info.plist" || true

          # 前端资源：无条件拷进 bundle 的 web/ 目录，App 靠它提供本地服务。
          # 不依赖 xcodegen 的资源处理，避免个别版本上 folder 引用不生效。
          rm -rf "$APP/web"
          mkdir -p "$APP/web"
          cp -R ../../web/static/. "$APP/web/"
          test -f "$APP/web/index.html" || (echo "错误：web/index.html 缺失" && exit 1)
          test -f "$APP/web/js/localapi.js" || (echo "错误：本机数据层脚本缺失" && exit 1)
          # 同步、分享、导入都是本机功能，缺一个文件就会静默失效，所以逐个确认
          for f in sync.js synclocal.js share.js syncui.js importers.js importui.js crypto.js localstore.js rules.js app.js; do
            test -f "$APP/web/js/$f" || (echo "错误：js/$f 缺失" && exit 1)
          done
          # 确认页面确实引用了这些模块（改动后忘了接线也能在这里挡住）
          grep -q "syncui.js" "$APP/web/js/app.js" || (echo "错误：app.js 未引入同步面板" && exit 1)
          grep -q "importui.js" "$APP/web/js/app.js" || (echo "错误：app.js 未引入导入面板" && exit 1)
          # 导入中转是整个推广逻辑的入口，接口没暴露就等于没做
          grep -q "importApply" "$APP/web/js/localapi.js" || (echo "错误：导入接口未暴露" && exit 1)
          grep -q "localapi.js" "$APP/web/js/api.js" || (echo "错误：api.js 未指向本机实现" && exit 1)
          echo "前端资源已打入 bundle：$(find "$APP/web" -type f | wc -l) 个文件"

          # ad-hoc 签名必须在改完 bundle 之后做，否则签名会被内容变动作废
          codesign --force --deep --sign - "$APP" || true
          zip -qry LifeBook.ipa Payload
          ls -lh LifeBook.ipa

      - name: Inspect app bundle
        run: |
          cd ios/build
          echo "=== App 包内容 ==="
          find Payload/*.app -maxdepth 1 -exec basename {} \; || true
          echo "=== 是否有图标 ==="
          ls Payload/*.app/Assets.car 2>/dev/null && echo "Assets.car 存在" || echo "Assets.car 缺失（靠 Info.plist 的 CFBundleIconFiles 兜底）"
          ls Payload/*.app/*.png 2>/dev/null | head -5 || true
          echo "=== 前端资源（本地服务用）==="
          find Payload/*.app/web -type f 2>/dev/null | head -20 || echo "缺少 web 目录！"
          echo "=== 图标与权限配置 ==="
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" Payload/*.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" Payload/*.app/Info.plist || true

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeBook-unsigned-ipa
          path: ios/build/LifeBook.ipa
          if-no-files-found: error
