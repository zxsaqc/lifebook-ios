<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>LifeBook · 生活记录台</title>

  <!-- PWA / 添加到 iPhone 主屏幕 -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2f6fed" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LifeBook" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="icon" href="/static/icon-192.png" />

  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app" id="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <img src="/static/icon-192.png" alt="LifeBook" />
        <div>
          <strong>LifeBook</strong>
          <div style="font-size:12px;color:var(--text-dim)">生活记录台</div>
        </div>
      </div>
      <nav id="nav-side">
        <button class="nav-item active" data-view="dashboard"><span>◎</span> 今天</button>
        <button class="nav-item" data-view="hours"><span>⏱</span> 工时</button>
        <button class="nav-item" data-view="ledger"><span>💰</span> 记账</button>
        <button class="nav-item" data-view="accounts"><span>🔑</span> 账号</button>
        <button class="nav-item" data-view="media"><span>🎬</span> 影视</button>
      </nav>
      <div class="sidebar-foot">
        <button class="btn ghost sm" id="lock-btn">锁定</button>
        <button class="btn ghost sm" id="logout-btn">退出</button>
      </div>
    </aside>

    <header class="topbar">
      <div class="title-row">
        <div>
          <h1 id="view-title">今天</h1>
          <div class="sub" id="view-subtitle">—</div>
        </div>
        <div class="topbar actions" id="view-actions"></div>
        <button class="btn ghost sm" id="import-btn" title="把别处记的数据导进来">导入</button>
        <button class="btn ghost sm" id="sync-btn" title="云同步（只上传密文）">同步</button>
        <button class="btn ghost sm" id="data-btn" title="数据与备份">数据</button>
      </div>
    </header>

    <main id="view"></main>

    <button class="fab" id="fab" aria-label="新增">＋</button>

    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-view="dashboard"><span class="ico">◎</span>今天</button>
      <button class="tab" data-view="hours"><span class="ico">⏱</span>工时</button>
      <button class="tab" data-view="ledger"><span class="ico">💰</span>记账</button>
      <button class="tab" data-view="accounts"><span class="ico">🔑</span>账号</button>
      <button class="tab" data-view="media"><span class="ico">🎬</span>影视</button>
    </nav>
  </div>

  <div class="auth-mask" id="auth-mask">
    <div class="auth-card">
      <img class="logo" src="/static/apple-touch-icon.png" alt="LifeBook" />
      <h1 id="auth-title">LifeBook</h1>
      <p class="lead" id="auth-desc">本地优先的生活记录台</p>
      <div class="card">
        <label class="field">
          <span id="auth-pw-label">主口令</span>
          <input type="password" id="auth-password" placeholder="至少 8 位，含字母与数字" autocomplete="current-password" />
        </label>
        <p class="hintline" id="auth-hint">口令用于加密本机数据，不会上传，也无法找回，请务必记住。</p>
        <p class="errline hidden" id="auth-error"></p>
        <button class="btn block" id="auth-submit">进入</button>
      </div>
    </div>
  </div>

  <div id="sheet-host"></div>
  <div class="toast-host" id="toast-host"></div>

  <!-- 注意：CSP 禁止内联脚本，服务注册逻辑放在 js/app.js 里 -->
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
